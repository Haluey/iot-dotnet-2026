<!DOCTYPE html>

<body>
    <h2>Javascript 학습</h2>
    <script>
        // 변수 - 타입지정이 없음. python과 동일
        let name = "홍길동";
        let age = 30;

        console.log(name)
        console.log(age)

        // alert(name + " " + age);
        // alert으로도 가능. alert + debugging => alerging
    </script>

    <script>
        // 연산자 - Pass! 나머지 프로그래밍 언어와 동일
        let a = 10;
        let b = 3;

        console.log(a % b);
    </script>

    <script>
        // 조건문. if, switch문
        if (age >= 19) {
            console.log("성인");
        }
        else {
            console.log("미성년자");
        }
    </script>

    <script>
        // 반복문. for, while문
        let c = 1;
        // while (c <= 5) {
        //     console.log(c);
        //     c++;
        // }

        for (let i = 1; i <= 5; i++) {
            console.log(i);
        }
    </script>

    <script>
        // 함수
        function add(a, b) {
            return a + b;
        }

        let result = add(a, b);

        console.log(result)

        // 익명함수, lambda함수
    </script>

    <script>
        // 배열. 문자열 사용법 Python과 동일
        // 홑따옴표(single quatation) 사용할 것
        let fruits = [
            '애플망고',
            "사과",
            "바나나",
            '포도'
        ];
        console.log(fruits);
    </script>

    <script>
        // 객체(Object) -> JSON!
        let student = {
            name: '홍길동',
            age: 30,
            score: 90,
            graduated: false
        }
        console.log(student);
    </script>
</body>
</html>
